name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (dev, fails if uv.lock is stale)
        run: uv sync --locked --extra dev

      - name: Dependency audit (pip-audit on the locked runtime + dev set)
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest + coverage)
        run: uv run pytest

      - name: Eval gate (offline, deterministic)
        run: uv run anchora eval

      - name: Honest fine-tune eval (frozen generations + promotion gate, no GPU)
        run: uv run make eval-honest

      - name: Judge calibration (frozen judge scores re-checked, no model)
        run: uv run make calibration

      - name: Adversarial guardrail suite (block rate + false-positive gate, offline)
        run: uv run make adversarial

      - name: Latency benchmark (offline p95 regression gate)
        run: uv run make bench

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
