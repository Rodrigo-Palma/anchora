# Version-update PRs are off (limit 0): upgrades are applied by hand and
# validated by the full local gate. Dependabot security updates still open PRs
# for advisories, and CI runs pip-audit on the locked set on every push.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
